name: "macOS Runner - Phase 4 AnyDesk"

# Thin orchestrator: each step delegates to a script in scripts/
# (mirrors the RDP-Awan Windows repo layout). No secrets are hardcoded
# here; secrets are mapped to env vars only where the script needs them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-check:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Phase 4 - 1. Prepare macOS
        shell: bash
        run: bash scripts/prepare-macos.sh

      - name: Phase 4 - 2. Install AnyDesk
        shell: bash
        run: bash scripts/install-anydesk.sh

      - name: Phase 4 - 3. Start AnyDesk
        shell: bash
        run: bash scripts/start-anydesk.sh

      - name: Phase 4 - 4. Configure Unattended Access
        shell: bash
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: bash scripts/setup-unattended.sh

      - name: Phase 4 - 5/6. Verify AnyDesk
        shell: bash
        run: bash scripts/verify-anydesk.sh

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Phase 2 - verify Tailscale
        shell: bash
        run: bash scripts/verify-tailscale.sh

      - name: Phase 3 - check GUI session (diagnostics context)
        shell: bash
        run: bash scripts/gui-diagnostics.sh

      - name: Phase 4 - 8. Display connection information
        shell: bash
        run: bash scripts/connection-info.sh

      - name: Phase 4 - 9. Keep Alive
        shell: bash
        run: bash scripts/keep-alive.sh
