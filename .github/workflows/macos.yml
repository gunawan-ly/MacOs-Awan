name: "macOS Runner - Phase 1"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-check:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Phase 2 - verify Tailscale
        shell: bash
        run: |
          echo "[INFO] Tailscale setup started"
          tailscale ip -4
          tailscale status --self=true || tailscale status
          echo "[INFO] Tailscale connected"

      - name: Phase 1 - macOS environment verification
        shell: bash
        run: |
          echo "[INFO] macOS setup started"
          echo "--- Runner context ---"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          echo ""
          echo "--- macOS version ---"
          sw_vers
          echo ""
          echo "--- CPU architecture ---"
          uname -a
          uname -m
          arch || true
          echo ""
          echo "--- Active user ---"
          whoami
          id
          echo "SHELL=${SHELL:-unknown}"
          echo ""
          echo "--- Hostname ---"
          hostname
          scutil --get ComputerName || true
          scutil --get LocalHostName || true
          echo ""
          echo "--- Disk info ---"
          df -h
          echo ""
          echo "[INFO] macOS verification completed"

      - name: Phase 1 - shell script execution test
        shell: bash
        run: |
          echo "[INFO] shell script test started"
          cat > /tmp/phase1-test.sh <<'EOF'
          #!/bin/bash
          echo "[INFO] hello from shell script on macOS"
          echo "date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "bash: $BASH_VERSION"
          EOF
          chmod +x /tmp/phase1-test.sh
          /tmp/phase1-test.sh
          bash /tmp/phase1-test.sh
          echo "[INFO] shell script test completed"

      - name: Phase 3 - check GUI session (option B diagnostics)
        shell: bash
        run: |
          echo "[INFO] GUI session diagnostics started (read-only, no system changes)"
          echo "--- logged in users ---"
          who || true
          w -h || true
          echo "--- console owner ---"
          stat -f %Su /dev/console || true
          echo "--- WindowServer ---"
          ps aux | grep -i "[W]indowServer" || echo "no WindowServer process found"
          echo "--- loginwindow ---"
          ps aux | grep -i "[l]oginwindow" || echo "no loginwindow process found"
          echo "--- displays ---"
          system_profiler SPDisplaysDataType 2>/dev/null | head -40 || true
          echo "--- Aqua session services ---"
          launchctl print "gui/$(id -u)" 2>&1 | head -20 || true
          echo "[INFO] GUI session diagnostics completed"

      - name: Phase 3B - build virtual display tool
        shell: bash
        run: |
          echo "[INFO] Building vdisplay (CGVirtualDisplay, single-file ObjC, no Xcode project)"
          clang --version | head -2
          clang -O2 -framework Foundation -framework CoreGraphics -o /tmp/vdisplay tools/vdisplay/vdisplay.m
          ls -l /tmp/vdisplay
          echo "[INFO] Build completed"

      - name: Phase 3B - create virtual display
        shell: bash
        run: |
          echo "[INFO] Starting vdisplay 1280x720 (owner process stays alive)"
          nohup /tmp/vdisplay 1280 720 > /tmp/vdisplay.log 2>&1 &
          echo $! > /tmp/vdisplay.pid
          for i in $(seq 1 12); do
            grep -q "READY" /tmp/vdisplay.log 2>/dev/null && break
            grep -q "FAIL" /tmp/vdisplay.log 2>/dev/null && break
            sleep 5
          done
          cat /tmp/vdisplay.log
          if grep -q "FAIL" /tmp/vdisplay.log 2>/dev/null; then
            echo "::error::vdisplay reported FAIL, see log above"
            exit 1
          fi
          if ! grep -q "READY" /tmp/vdisplay.log 2>/dev/null; then
            echo "::error::vdisplay did not report READY within 60s"
            kill -KILL $(cat /tmp/vdisplay.pid) 2>/dev/null || true
            exit 1
          fi
          kill -0 $(cat /tmp/vdisplay.pid) 2>/dev/null && echo "[INFO] vdisplay owner alive" || { echo "::error::vdisplay owner died"; exit 1; }
          echo "--- displays after virtual display ---"
          system_profiler SPDisplaysDataType 2>/dev/null || echo "no displays detected"
          echo "[INFO] Virtual display setup completed"

      - name: Phase 3 - enable Screen Sharing (VNC)
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          echo "[INFO] Remote GUI setup started"
          if [ -z "$VNC_PASSWORD" ]; then
            echo "::error::VNC_PASSWORD secret is not set. Create it in repo Settings > Secrets > Actions."
            exit 1
          fi
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          echo "[INFO] Configuring Remote Management for all users"
          sudo "$KICKSTART" -activate -configure -access -on -privs -all -restart -agent -allowAccessFor -allUsers
          echo "[INFO] Enabling VNC legacy mode"
          sudo "$KICKSTART" -configure -clientopts -setvnclegacy -vnclegacy yes
          echo "[INFO] Setting VNC password from secret"
          sudo "$KICKSTART" -configure -clientopts -setvncpw -vncpw "$VNC_PASSWORD"
          unset VNC_PASSWORD
          echo "[INFO] Restarting ARD agent"
          sudo "$KICKSTART" -restart -agent -console || sudo "$KICKSTART" -restart -agent
          echo "[INFO] Waking display (temporary assertion, ends with workflow)"
          caffeinate -u -t 300 &
          echo "[INFO] Remote GUI ready"

      - name: Phase 3 - verify Screen Sharing
        shell: bash
        run: |
          echo "[INFO] Verifying Screen Sharing listener on port 5900"
          sudo lsof -iTCP:5900 -sTCP:LISTEN || sudo lsof -i :5900 || true
          ps aux | grep -i -E "screensharing|ARDAgent|VNC" | grep -v grep || true
          echo "--- GUI session after setup ---"
          stat -f %Su /dev/console || true
          ps aux | grep -i "[W]indowServer" || echo "no WindowServer process found"
          echo "--- displays detected ---"
          system_profiler SPDisplaysDataType 2>/dev/null || echo "no displays detected"
          echo "--- display resolutions ---"
          system_profiler SPDisplaysDataType 2>/dev/null | grep -i -E "Resolution|Display Type|Main Display|Mirror|Online" || echo "no resolution info"
          echo "--- framebuffer check ---"
          ioreg -l 2>/dev/null | grep -i -m 3 "IODisplayPrefsKey" || echo "no IODisplay framebuffer entries"
          echo "--- Tailscale IP for VNC ---"
          tailscale ip -4
          echo "[INFO] Connection information available"
          echo "[INFO] Connect VNC client to <TAILSCALE_IP>:5900 via Tailnet using VNC password"

      - name: Phase 1 - keep-alive (manual cancel, max 6h)
        shell: bash
        run: |
          echo "[INFO] Keep-alive started - cancel workflow manually to stop (max 6h GitHub limit)"
          while true; do
            echo "[INFO] Alive at $(date -u '+%Y-%m-%d %H:%M:%S UTC') - workflow ready"
            sleep 60
          done
